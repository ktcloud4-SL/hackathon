services:
  nginx:
    image: nginx:alpine
    container_name: onereport-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - onereport-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onereport-frontend:latest
    container_name: onereport-frontend
    restart: always
    expose:
      - "3000"
    networks:
      - onereport-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onereport-backend:latest
    container_name: onereport-backend
    restart: always
    expose:
      - "8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-onereport}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
    depends_on:
      - postgres
    networks:
      - onereport-net

  postgres:
    image: postgres:16-alpine
    container_name: onereport-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-onereport}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onereport-net

networks:
  onereport-net:
    driver: bridge

volumes:
  postgres_data:
