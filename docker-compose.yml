services:
  nginx:
    image: nginx:alpine
    container_name: onereport-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - onereport-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onereport-frontend:latest
    container_name: onereport-frontend
    restart: always
    expose:
      - "3000"
    networks:
      - onereport-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onereport-backend:latest
    container_name: onereport-backend
    restart: always
    expose:
      - "8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-onereport}
      - JWT_SECRET=${JWT_SECRET:-onereport-super-secret-jwt-key-must-be-32bytes}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - CORS_ORIGINS=["*"]
      - SSE_HEARTBEAT_SECONDS=15.0
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - STORAGE_PREFIX=reports
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onereport-net

  postgres:
    image: postgres:16-alpine
    container_name: onereport-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-onereport}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-onereport}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - onereport-net

networks:
  onereport-net:
    driver: bridge

volumes:
  postgres_data:
