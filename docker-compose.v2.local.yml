name: onereport-v2

services:
  postgres-v2:
    image: postgres:16-alpine
    container_name: onereport-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55432:5432"
    volumes:
      - onereport_v2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-v2:
    image: minio/minio:latest
    container_name: onereport-v2-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - onereport_v2_minio_data:/data
  minio-init-v2:
    image: minio/mc:latest
    container_name: onereport-v2-minio-init
    depends_on:
      - minio-v2
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >-
      /bin/sh -c "until mc alias set v2 http://minio-v2:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY; do sleep 1; done &&
      mc mb --ignore-existing v2/$$S3_BUCKET"

volumes:
  onereport_v2_postgres_data:
    name: onereport-v2-postgres-data
  onereport_v2_minio_data:
    name: onereport-v2-minio-data
